layout:
    imports:
        -
            id: dylvn_faq
            root: page_content
    actions:
        - '@setOption':
            id: page_title
            optionName: defaultValue
            optionValue: 'dylvn.faq.frontend.page_title'
        - '@setOption':
            id: faq_categories_list
            optionName: vars.categories
            optionValue: '=data["faq_page"].getCategories()'
        - '@remove':
            id: faq_page_title
